[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apprentice"
version = "0.1.0"
description = "A minimalist AI dojo for practicing professional judgment under pressure"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Apprentice contributors" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
  "uvicorn>=0.53.0",
]

[project.optional-dependencies]
observability = [
  "langfuse>=4.7,<5",
]
hosted = [
  "openai>=1.68",
]

[project.urls]
Homepage = "https://github.com/Ami-Khokhar/Apprentice"
Repository = "https://github.com/Ami-Khokhar/Apprentice"
Issues = "https://github.com/Ami-Khokhar/Apprentice/issues"
Security = "https://github.com/Ami-Khokhar/Apprentice/security/policy"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "openai>=1.68",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["apprentice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
