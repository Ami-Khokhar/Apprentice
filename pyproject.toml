[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apprentice"
version = "0.1.0"
description = "A minimalist AI dojo for practicing professional judgment under pressure"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["apprentice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
